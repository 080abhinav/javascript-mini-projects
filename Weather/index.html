<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>WeatherNow</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"

    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1163/1163661.png">

<body>

  <div class="navbar">
    <div class="logo">Weather<div class="logo" id="now">Now</div>
    </div>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">About</a>
    </div>
  </div>

  <div class="container">
    <div class="weather-card">

      <h1>Weather</h1>

      <div class="search-box">
        <input type="text" id="city" placeholder="Enter city">
        <button onclick="searchWeather()">Search</button>
      </div>

      <div class="temp" id="temp">--°C</div>
      <div class="city" id="cityName">City Name</div>
      <div class="desc" id="desc">Weather description</div>

    </div>
  </div>
